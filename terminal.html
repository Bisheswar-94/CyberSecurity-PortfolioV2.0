<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cyber Terminal | Bisheswar Bhattacharjee</title>

<link rel="stylesheet"
href="assets/css/terminal.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<canvas id="matrix"></canvas>

<div class="terminal-window">

<div class="terminal-header">

<div class="buttons">

<span class="red"></span>

<span class="yellow"></span>

<span class="green"></span>

</div>

<div class="title">

bisheswar@portfolio: ~

</div>

</div>

<div id="terminal-body">

<div class="output">

<h2>

CyberPortfolio Terminal v3.0

</h2>

<p>

Welcome Bisheswar.

</p>

<p>

Type <span class="highlight">help</span> to see available commands.

</p>

</div>

<div class="input-line">

<span class="prompt">

bisheswar@portfolio:~$

</span>

<input

id="command"

type="text"

autocomplete="off"

autofocus

placeholder="Enter command..."

/>

</div>

</div>

</div>

<script src="assets/js/matrix.js"></script>

<script src="assets/js/terminal.js"></script>

</body>

</html>
